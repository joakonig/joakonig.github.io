<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobre mí | Joaquín Vargas</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* === Global Styles === */
    :root {
      --primary: #007acc;
      --primary-dark: #005a9e;
      --secondary: #00c896;
      --bg: #f9f9f9;
      --text: #333;
      --text-light: #666;
      --card-bg: #fff;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      --shadow-hover: 0 4px 12px rgba(0, 0, 0, 0.15);
      --border: #e5e5e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    /* === Header === */
    header {
      background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
      color: white;
      padding: 25px 0;
      text-align: center;
      box-shadow: var(--shadow);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    nav a {
      color: white;
      margin: 0 20px;
      text-decoration: none;
      font-weight: 500;
      transition: all 0.3s ease;
      padding: 5px 10px;
      border-radius: 20px;
    }

    nav a:hover, nav a.active {
      background: rgba(255, 255, 255, 0.2);
    }

    /* === Hero / Intro === */
    .hero {
      text-align: center;
      padding: 60px 20px 40px 20px;
      background: linear-gradient(135deg, #f9f9f9 0%, #e8f4f8 100%);
    }

    .hero img {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0, 122, 204, 0.3);
      border: 4px solid white;
      object-fit: cover;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
    }

    .hero h1 {
      font-size: 2.2em;
      margin-bottom: 10px;
      color: var(--primary);
    }

    .hero .subtitle {
      font-size: 1.2em;
      color: var(--text);
      font-weight: 600;
      margin-bottom: 15px;
    }

    .hero .location {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      color: var(--text-light);
      margin-bottom: 20px;
    }

    .hero .description {
      font-size: 1.05em;
      color: #555;
      max-width: 800px;
      margin: 0 auto 30px;
      text-align: justify;
      line-height: 1.7;
    }

    .contact-buttons {
      display: flex;
      gap: 15px;
      justify-content: center;
      flex-wrap: wrap;
    }

    .btn {
      padding: 10px 25px;
      border-radius: 25px;
      text-decoration: none;
      font-weight: 600;
      transition: all 0.3s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }

    .btn-secondary {
      background: white;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 122, 204, 0.3);
    }

    /* === Quick Stats === */
    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 40px;
      padding: 30px 20px;
      background: white;
      flex-wrap: wrap;
      border-bottom: 1px solid var(--border);
    }

    .stat-item {
      text-align: center;
    }

    .stat-number {
      font-size: 1.8em;
      font-weight: bold;
      color: var(--primary);
    }

    .stat-label {
      color: var(--text-light);
      font-size: 0.9em;
    }

    /* === Content Sections === */
    .section-container {
      max-width: 1000px;
      margin: 0 auto;
      padding: 40px 20px 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: var(--shadow);
      padding: 30px;
      margin-bottom: 30px;
      transition: all 0.3s ease;
      border: 1px solid var(--border);
    }

    .card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .card h2 {
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5em;
    }

    .card h2 i {
      font-size: 0.9em;
      opacity: 0.8;
    }

    /* === Timeline for Experience === */
    .timeline {
      position: relative;
      padding-left: 35px;
    }

    .timeline::before {
      content: '';
      position: absolute;
      left: 10px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--border);
    }

    .timeline-item {
      position: relative;
      padding-bottom: 30px;
    }

    .timeline-item::before {
      content: '';
      position: absolute;
      left: -29px;
      top: 5px;
      width: 12px;
      height: 12px;
      background: var(--primary);
      border-radius: 50%;
      border: 3px solid white;
      box-shadow: 0 0 0 3px var(--border);
    }

    .timeline-date {
      color: var(--text-light);
      font-size: 0.9em;
      margin-bottom: 5px;
    }

    .timeline-title {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 5px;
      font-size: 1.1em;
    }

    .timeline-company {
      color: var(--primary);
      margin-bottom: 10px;
      font-weight: 600;
    }

    .timeline-description {
      color: var(--text-light);
      font-size: 0.95em;
      line-height: 1.6;
      text-align: justify;
    }

    /* === Skills Grid === */
    .skills-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .skill-category {
      background: #f8f9fa;
      padding: 20px;
      border-radius: 8px;
      border-left: 4px solid var(--primary);
    }

    .skill-category h3 {
      color: var(--primary);
      margin-top: 0;
      margin-bottom: 15px;
      font-size: 1.1em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .skill-tag {
      background: white;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 0.9em;
      border: 1px solid var(--border);
      transition: all 0.3s ease;
    }

    .skill-tag:hover {
      background: var(--primary);
      color: white;
      transform: translateY(-2px);
    }

    /* === Language Bars === */
    .language-item {
      margin-bottom: 20px;
    }

    .language-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .language-name {
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .language-level {
      color: var(--text-light);
      font-size: 0.9em;
    }

    .progress-bar {
      background: var(--border);
      height: 8px;
      border-radius: 10px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), var(--secondary));
      border-radius: 10px;
      transition: width 1.5s ease;
    }

    /* === Certifications Grid === */
    .cert-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .cert-item {
      background: #f8f9fa;
      padding: 15px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      gap: 12px;
      transition: all 0.3s ease;
      border: 1px solid var(--border);
    }

    .cert-item:hover {
      background: white;
      box-shadow: var(--shadow);
      transform: translateX(5px);
    }

    .cert-icon {
      font-size: 1.5em;
      color: var(--primary);
    }

    .cert-info {
      flex: 1;
    }

    .cert-name {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 2px;
    }

    .cert-issuer {
      font-size: 0.85em;
      color: var(--text-light);
    }

    /* === Publications === */
    .publication-item {
      padding: 20px;
      background: #f8f9fa;
      border-radius: 8px;
      margin-bottom: 15px;
      border-left: 4px solid var(--primary);
      transition: all 0.3s ease;
    }

    .publication-item:hover {
      background: white;
      box-shadow: var(--shadow);
    }

    .publication-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 5px;
    }

    .publication-meta {
      color: var(--text-light);
      font-size: 0.9em;
      margin-bottom: 8px;
    }

    .publication-doi {
      color: var(--primary);
      font-size: 0.85em;
    }

    /* === Achievements === */
    .achievements-list {
      display: grid;
      gap: 15px;
    }

    .achievement-item {
      background: linear-gradient(135deg, #fff9e6 0%, #fff5d6 100%);
      padding: 20px;
      border-radius: 10px;
      border-left: 4px solid #ffd700;
      display: flex;
      align-items: center;
      gap: 15px;
      transition: all 0.3s ease;
    }

    .achievement-item:hover {
      transform: translateX(5px);
      box-shadow: var(--shadow);
    }

    .achievement-icon {
      font-size: 2em;
      color: #ff9800;
    }

    .achievement-text {
      flex: 1;
    }

    .achievement-title {
      font-weight: 600;
      color: var(--text);
      margin-bottom: 3px;
    }

    .achievement-desc {
      font-size: 0.9em;
      color: var(--text-light);
    }

    /* === Projects Section === */
    .project-item {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 20px;
      transition: all 0.3s ease;
    }

    .project-item:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-2px);
    }

    .project-year {
      display: inline-block;
      background: var(--primary);
      color: white;
      padding: 3px 10px;
      border-radius: 15px;
      font-size: 0.85em;
      margin-bottom: 10px;
    }

    .project-title {
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
      font-size: 1.1em;
    }

    .project-description {
      color: var(--text-light);
      line-height: 1.6;
      text-align: justify;
    }

    .project-tech {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .tech-tag {
      background: #e3f2fd;
      color: var(--primary);
      padding: 4px 10px;
      border-radius: 15px;
      font-size: 0.85em;
    }

    /* === Footer === */
    footer {
      text-align: center;
      padding: 30px 20px;
      background: linear-gradient(135deg, #f1f1f1 0%, #e8e8e8 100%);
      color: #555;
      margin
